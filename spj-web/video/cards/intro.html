<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Silent Payjoin</title>
    <link rel="stylesheet" href="../../static/fonts/fonts.css" />
    <link rel="stylesheet" href="card.css" />
  </head>
  <body>
    <p class="title rise">Bob wants both. His wallet makes him pick.</p>
    <ul class="lines">
      <li class="rise" data-at="silent payments">
        <span class="sp">Silent payments</span>: one address, and nobody can
        link the transactions to it
      </li>
      <li class="rise" data-at="and payjoin">
        <span class="pj">Payjoin</span>: Bob adds a coin, so the transaction is
        hard to read
      </li>
      <li class="rise" data-at="today wallets toggle">
        Wallets today toggle between the two, never both at once
      </li>
    </ul>
  </body>
