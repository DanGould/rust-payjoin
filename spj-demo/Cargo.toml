[package]
name = "spj-demo"
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "Recorded regtest demonstration of static payjoin properties"

[dependencies]
axum = "0.8"
bhttp = "0.6.1"
bitcoin = { version = "0.32.9", features = ["base64", "rand-std"] }
http-body-util = "0.1.3"
ohttp = { package = "bitcoin-ohttp", version = "0.6.0" }
payjoin = { path = "../payjoin", features = ["_static-session"] }
payjoin-mailroom = { path = "../payjoin-mailroom" }
payjoin-test-utils = { path = "../payjoin-test-utils" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tempfile = "3.20.0"
tokio = { version = "1.52.3", features = ["rt", "macros"] }
tower = "0.5.2"
