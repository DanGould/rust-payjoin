<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Silent payjoin</title>
    <link rel="stylesheet" href="../../static/fonts/fonts.css" />
    <link rel="stylesheet" href="card.css" />
  </head>
  <body>
    <div class="mark rise"></div>
    <p class="title rise">Bob wants both. His wallet makes him pick.</p>
    <ul class="lines">
      <li class="rise" style="--i: 1">
        <span class="sp">Silent payments</span>: one address, and nobody can
        link the payments to it
      </li>
      <li class="rise" style="--i: 2.4">
        <span class="pj">Payjoin</span>: Bob adds a coin, so the payment is hard
        to read
      </li>
      <li class="rise" style="--i: 5.2">
        Here, three wallets pay him on a test network
      </li>
      <li class="rise" style="--i: 7.6">None of them makes him pick</li>
    </ul>
  </body>
</html>
