[package]
name = "spj-demo"
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "Regtest demonstration of silent payjoin payment strings and transport"

[dependencies]
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
bitcoin = { version = "0.32.102", features = ["base64", "rand-std"] }
payjoin = { version = "1.2.0", features = ["_contact-log"] }
payjoin-mailroom = { version = "0.1.3", features = ["_manual-tls"] }
payjoin-test-utils = "0.0.1"
reqwest = { version = "0.12.23", default-features = false, features = [
  "rustls-tls",
] }
rustls = { version = "0.23.46", default-features = false, features = ["ring"] }
serde_json = "1.0.149"
tempfile = "3.20.0"
tokio = { version = "1.52.3", features = ["full"] }
