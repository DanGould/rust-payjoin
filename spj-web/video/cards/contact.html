<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Silent Payjoin Contact URI</title>
    <link rel="stylesheet" href="../../static/fonts/fonts.css" />
    <link rel="stylesheet" href="card.css" />
  </head>
  <body>
    <div class="logomark rise" aria-hidden="true">
      <img class="logo" src="../../static/brand/payjoin.svg" alt="" />
      <span class="times">×</span>
      <span class="disc"
        ><img src="../../static/brand/silent-payments.png" alt=""
      /></span>
    </div>
    <p class="kicker rise">Two</p>
    <p class="title rise" style="--i: 0.4">
      <span class="spj">Silent Payjoin</span> Contact URI
    </p>
    <ul class="lines">
      <li class="rise" data-at="for someone bob">
        For someone Bob transacts with again and again
      </li>
      <li class="rise" data-at="like his exchange">
        His exchange, or a funder paying a grantee
      </li>
      <li class="rise" data-at="no address">
        No address. One mailbox, and one label, for many transfers
      </li>
    </ul>
  </body>
</html>
